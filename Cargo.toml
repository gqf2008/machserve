[workspace]
resolver = "2"
members = [
    "crates/mach-engine",
    "crates/mach-kernel",
    "crates/mach-kernel-sys",
    "crates/mach-bench",
    "crates/mach-model",
    "crates/mach-server",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lightseekorg/machserve"
rust-version = "1.97"

[workspace.lints.clippy]
# P0 baseline: default lint set. Tighten with pedantic/nursery in later phases.
all = "warn"

[workspace.dependencies]
mach-engine = { path = "crates/mach-engine", version = "0.2.0" }
mach-kernel = { path = "crates/mach-kernel", version = "0.2.0" }
mach-kernel-sys = { path = "crates/mach-kernel-sys", version = "0.2.0" }
mach-model = { path = "crates/mach-model", version = "0.2.0" }






