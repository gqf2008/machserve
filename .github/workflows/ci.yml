name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --features hip -- -D warnings

  build:
    name: check (hip on / off)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: check without hip (CPU-only surface)
        run: cargo check --workspace --all-targets
      - name: check with hip (type-check only, no GPU needed)
        run: cargo check --workspace --all-targets --features hip

  test:
    name: CPU tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: workspace lib tests
        run: cargo test --workspace --lib
      # `decode_slice` runs its CPU case here (the GPU cases are compiled out
      # without the feature); `fp16` and `spec_decode` are `--features hip`-only
      # suites, so without the feature they report "0 tests" rather than being
      # skipped — they are NOT covered by this job. `load_safetensors` runs its
      # CPU cases (15 passed + 1 ignored) and compiles out its 9 hip-gated GPU cases (25 with hip, 8 ignored).
      - name: integration tests (CPU-reachable only)
        run: cargo test -p mach-model --test decode_slice --test fp16 --test load_safetensors --test spec_decode

  gpu:
    name: GPU parity (opt-in, self-hosted AMD)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, amd, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: engine HIP memory-pool parity
        run: cargo test -p mach-engine --features hip --lib -- --ignored --test-threads=1
      # NOTE: this step runs only the *non*-`#[ignore]`d model tests, and the two
      # ways that leaves GPU parity uncovered are different:
      #  - truly `#[ignore]`d suites (`mrope_gpu`, `embed_gpu`, `int8_kv`,
      #    `vision_gpu`, `load_safetensors`, ...) are simply not selected here
      #    (libtest reports them as ignored). Most need a `MACH_TEST_*` opt-in,
      #    but today only `mrope_gpu` fails loudly when selected without it;
      #    `embed_gpu` / `int8_kv` / `vision_gpu` / `load_safetensors` still
      #    `eprintln! + return` on the unset-opt-in path, so selecting them
      #    without the env still reports "ok" silently (same #163 remaining work);
      #  - the real-model suites (`real_model`, `qwen3_real`, `qwen15_real`,
      #    `qwen3_q4_real`, `moe_real`) are NOT ignored: they run here, but
      #    self-skip via `eprintln! + return` when `MACH_TEST_MODEL` is unset,
      #    and libtest only replays the output of *failing* tests — so they
      #    report "ok" with nothing shown (the silent-green class tracked in #163).
      - name: model tests (hip, non-ignored only)
        run: cargo test -p mach-model --features hip -- --test-threads=1
      # Same caveat: `crates/mach-server/tests/server.rs` has two `#[ignore]`d GPU
      # parity cases that this command does not select.
      - name: server tests
        run: cargo test -p mach-server --features hip
