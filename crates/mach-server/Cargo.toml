[package]
name = "mach-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MachServe OpenAI-compatible HTTP server over the continuous-batching engine."

[features]
default = []
hip = ["mach-model/hip"]

[dependencies]
axum = "0.8"
mach-kernel-sys = { workspace = true }
mach-model = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1.19"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true


