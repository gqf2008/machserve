[package]
name = "mach-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MachServe OpenAI-compatible HTTP server over the continuous-batching engine."

[features]
default = []
hip = ["mach-model/hip"]

[dependencies]
base64 = ">=0.22.1, <0.23"
image = { version = ">=0.25.6, <0.26", default-features = false, features = ["png", "jpeg"] }
axum = "0.8"
mach-kernel-sys = { workspace = true }
mach-model = { workspace = true }
reqwest = { version = ">=0.12.4, <0.13", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1.19"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true


